services:
  app:
    build: ./app
    container_name: tv_app
    restart: always
    env_file: .env
    volumes:
      - ./app/videos:/app/videos
      - ./app/uploads:/app/uploads

  nginx:
    image: nginx:latest
    container_name: tv_nginx
    restart: always
    ports:
      - "81:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./app/videos:/usr/share/nginx/html/videos:ro
    depends_on:
      - app
