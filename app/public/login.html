<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Corporativa — Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #16213e;
      border-radius: 12px;
      padding: 40px;
      width: 340px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    h1 {
      color: #e0e0e0;
      font-size: 1.4rem;
      margin-bottom: 8px;
      text-align: center;
    }
    p.sub {
      color: #888;
      font-size: 0.85rem;
      text-align: center;
      margin-bottom: 28px;
    }
    label {
      display: block;
      color: #aaa;
      font-size: 0.82rem;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #2a2a4a;
      background: #0f3460;
      color: #e0e0e0;
      font-size: 0.95rem;
      margin-bottom: 18px;
      outline: none;
      transition: border 0.2s;
    }
    input:focus { border-color: #e94560; }
    button {
      width: 100%;
      padding: 11px;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #c73652; }
    .erro {
      background: #3a0a0a;
      color: #ff6b6b;
      border-radius: 6px;
      padding: 10px;
      font-size: 0.85rem;
      text-align: center;
      margin-bottom: 16px;
      display: none;
    }
    .erro.visivel { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>TV Corporativa</h1>
    <p class="sub">Painel de Administração</p>
    <div class="erro visivel" id="msg-erro" style="display:none"></div>
    <form method="POST" action="/login">
      <label for="user">Usuário</label>
      <input type="text" id="user" name="user" autocomplete="username" required>
      <label for="pass">Senha</label>
      <input type="password" id="pass" name="pass" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.get('erro')) {
      const el = document.getElementById('msg-erro');
      el.textContent = 'Usuário ou senha incorretos.';
      el.style.display = 'block';
    }
  </script>
</body>
</html>
