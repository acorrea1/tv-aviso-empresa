<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Corporativa — Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 40px 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 600px;
      margin: 0 auto 32px;
    }
    header h1 { font-size: 1.3rem; }
    header a {
      color: #888;
      font-size: 0.85rem;
      text-decoration: none;
    }
    header a:hover { color: #e94560; }
    .card {
      background: #16213e;
      border-radius: 12px;
      padding: 32px;
      max-width: 600px;
      margin: 0 auto 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    h2 { font-size: 1rem; color: #aaa; margin-bottom: 20px; }
    .drop-area {
      border: 2px dashed #2a2a5a;
      border-radius: 10px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 20px;
    }
    .drop-area:hover, .drop-area.over {
      border-color: #e94560;
      background: #1a1a3a;
    }
    .drop-area p { color: #777; font-size: 0.9rem; margin-top: 8px; }
    .drop-area span { font-size: 2rem; }
    #file-name {
      color: #7ec8e3;
      font-size: 0.85rem;
      margin-bottom: 16px;
      min-height: 20px;
    }
    button[type="submit"] {
      width: 100%;
      padding: 12px;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button[type="submit"]:hover { background: #c73652; }
    button[type="submit"]:disabled { background: #555; cursor: default; }
    .progress-wrap {
      margin-top: 14px;
      display: none;
    }
    progress {
      width: 100%;
      height: 8px;
      border-radius: 4px;
      appearance: none;
    }
    progress::-webkit-progress-bar { background: #2a2a4a; border-radius: 4px; }
    progress::-webkit-progress-value { background: #e94560; border-radius: 4px; }
    .info {
      background: #0d2137;
      border-radius: 8px;
      padding: 16px 20px;
      font-size: 0.85rem;
      color: #7ec8e3;
      max-width: 600px;
      margin: 0 auto;
    }
    .info strong { display: block; margin-bottom: 6px; color: #aaa; }
  </style>
</head>
<body>
  <header>
    <h1>TV Corporativa</h1>
    <a href="/logout">Sair</a>
  </header>

  <div class="card">
    <h2>Enviar novo vídeo</h2>
    <form id="upload-form" method="POST" action="/upload" enctype="multipart/form-data">
      <div class="drop-area" id="drop-area" onclick="document.getElementById('video-input').click()">
        <span>🎬</span>
        <p>Clique ou arraste o arquivo aqui</p>
        <p>MP4 recomendado</p>
      </div>
      <div id="file-name"></div>
      <input type="file" id="video-input" name="video" accept="video/*" style="display:none" required>
      <button type="submit" id="btn-enviar" disabled>Enviar vídeo</button>
      <div class="progress-wrap" id="progress-wrap">
        <progress id="progress" value="0" max="100"></progress>
      </div>
    </form>
  </div>

  <div class="info">
    <strong>Como funciona</strong>
    O vídeo enviado substitui o arquivo atual exibido nas TVs em tempo real.<br>
    URL de exibição nas TVs: <code>/tv</code>
  </div>

  <script>
    const input = document.getElementById('video-input');
    const btn = document.getElementById('btn-enviar');
    const fileName = document.getElementById('file-name');
    const dropArea = document.getElementById('drop-area');

    input.addEventListener('change', () => {
      if (input.files[0]) {
        fileName.textContent = '📄 ' + input.files[0].name;
        btn.disabled = false;
      }
    });

    ['dragover','dragenter'].forEach(e => dropArea.addEventListener(e, ev => {
      ev.preventDefault(); dropArea.classList.add('over');
    }));
    ['dragleave','drop'].forEach(e => dropArea.addEventListener(e, ev => {
      ev.preventDefault(); dropArea.classList.remove('over');
    }));
    dropArea.addEventListener('drop', ev => {
      const files = ev.dataTransfer.files;
      if (files[0]) {
        input.files = files;
        fileName.textContent = '📄 ' + files[0].name;
        btn.disabled = false;
      }
    });

    document.getElementById('upload-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const formData = new FormData(this);
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/upload');
      document.getElementById('progress-wrap').style.display = 'block';
      btn.disabled = true;
      btn.textContent = 'Enviando...';
      xhr.upload.addEventListener('progress', ev => {
        if (ev.lengthComputable)
          document.getElementById('progress').value = (ev.loaded / ev.total) * 100;
      });
      xhr.addEventListener('load', () => { window.location.href = '/dashboard'; });
      xhr.send(formData);
    });
  </script>
</body>
</html>
